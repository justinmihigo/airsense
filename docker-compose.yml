services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      ML_API_URL: http://ml:5000
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      ml:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - airsense

  ml:
    build: ./ml
    ports:
      - "5000:5000"
    volumes:
      - ./ml/models:/app/models
    networks:
      - airsense

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_ML_API_URL: ${VITE_ML_API_URL:-http://localhost:5000}
        VITE_INFLUX_URL: ${VITE_INFLUX_URL}
        VITE_INFLUX_BUCKET: ${VITE_INFLUX_BUCKET:-Kigali}
        VITE_INFLUX_ORG: ${VITE_INFLUX_ORG}
        VITE_INFLUX_TOKEN: ${VITE_INFLUX_TOKEN}
        VITE_INFLUX_MEASUREMENT: ${VITE_INFLUX_MEASUREMENT:-airquality}
        VITE_MQTT_URL: ${VITE_MQTT_URL}
        VITE_MQTT_TOPIC: ${VITE_MQTT_TOPIC:-sensors/indoor/airquality}
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - airsense

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - airsense

networks:
  airsense:
    driver: bridge

volumes:
  mongodb_data:
